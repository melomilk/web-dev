<section *ngIf="displayedProducts.length > 0; else emptyState">
  <section class="grid">
    <app-product-item
      *ngFor="let p of displayedProducts; trackBy: trackById"
      [product]="p"
      (delete)="handleDelete($event)">
    </app-product-item>
  </section>
</section>

<ng-template #emptyState>
  <p class="empty">No products in this category.</p>
</ng-template>

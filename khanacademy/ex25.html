<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Project: Event invite</title>
        <style>
            body {
                background-color: #ffd1df;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
                font-family: Arial, sans-serif;
            }

            .invite {
                text-align: center;
                background: white;
                padding: 24px 32px;
                border-radius: 12px;
                box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            }

            button {
                margin-top: 16px;
                padding: 10px 20px;
                font-size: 16px;
                border: none;
                border-radius: 20px;
                background-color: #ff5c8a;
                color: white;
                cursor: pointer;
            }

            button:hover {
                background-color: #e84c78;
            }

            ul {
                list-style-position: inside;
                padding: 0;
            }
        </style>
    </head>
    <body>
        <div class="invite">
            <h1>Pregame!</h1>
            <h2>vodka cranberry btw</h2>

            <p>The details:</p>
            <ul>
                <li>bring treats</li>
                <li>don't bring ppl that i don't know</li>
                <li>don't bring up ur smokeshow girlies pls im scared</li>
                <li>did i mention bring treats?</li>
            </ul>

            <button>RSVP</button>
        </div>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook – log in or sign up</title>
  <link rel = "stylesheet" type = "text/css" href = "styles.css">
</head>

<body>
  <div class="page-wrapper">
    <section class="brand-panel">
      <h1 class="fb-logo">facebook</h1>
      <p class="fb-tagline">
        Connect with friends and the world around you on Facebook.
      </p>
    </section>

    <section class="login-panel">
      <div class="login-card">
        <form class="login-form" action="#" method="post">
          <input type="text" class="text-input" name="email" placeholder="Email or phone number" required>
          <input type="password" class="text-input" name="password" placeholder="Password" required>
          <button type="submit" class="login-btn">Log In</button>
        </form>

        <a href="#" class="forgot-link">Forgot password?</a>

        <div class="divider"></div>

        <button class="create-btn" type="button">Create new account</button>
      </div>

      <p class="create-page-text">
        <a href="#">Create a Page</a> for a celebrity, brand or business.
      </p>
    </section>
  </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram</title>
  <link rel = "stylesheet" type = "text/css" href = "styles.css">

</head>

<body>
  <main class="page-wrapper">
    <section class="promo-panel">
      <div class="ig-logo-mark">
        <span></span>
      </div>
      <h1 class="promo-heading">
        See everyday moments from your <span class="promo-highlight">close friends.</span>
      </h1>
      <p class="promo-subtext">
        Log in to see photos, videos and messages from the people you care about most.
      </p>
    </section>

    <section class="login-panel" aria-label="Log into Instagram">
      <div class="login-card">
        <header class="login-card-header">
          <span class="chevron">&#x2039;</span>
          <span class="login-title">Log into Instagram</span>
        </header>

        <form class="login-form" action="#" method="post">
          <input class="text-input" type="text" name="identifier"
            placeholder="Mobile number, username or email" required />
          <input class="text-input" type="password" name="password" placeholder="Password" required />
          <button type="submit" class="login-btn">Log in</button>
        </form>

        <a href="#" class="forgot-link">Forgot password?</a>

        <div class="line-divider"></div>

        <button type="button" class="secondary-btn">
          <span class="fb-icon"></span>
          <span>Log in with Facebook</span>
        </button>

        <button type="button" class="create-btn">Create new account</button>

        <div class="meta-footer">
          <div class="meta-symbol"></div>
          <span class="meta-text">&copy; 2026 Instagram from Meta</span>
        </div>
      </div>
    </section>
  </main>
</body>

</html>
